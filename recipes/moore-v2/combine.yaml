# MooreSpeechCorporaV2: label speakers and export, after the five source recipes and
#   fasospeech combine data/proverbs-p data/proverbs-sissao data/tales-sibalo data/tales-v1 data/riddles-v1 --output data/moore-v2
#   fasospeech run recipes/moore-v2/combine.yaml --output data/moore-v2
# Listen to data/moore-v2/speakers/*.wav, fix data/moore-v2/speakers/labels.yaml if needed, and rerun.
language: mos
steps: [speakers, export]
export:
  formats: [manifest, hf]
  layout: corpora_v1
  # repo_id: anyantudre/MooreSpeechCorporaV2
  private: true
  gated: manual
