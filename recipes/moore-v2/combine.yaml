# MooreSpeechCorporaV2: label speakers and export, after the six source recipes and
#   fasospeech combine data/proverbs-p data/proverbs-sissao data/tales-sibalo data/tales-v1 data/tales-vol5 data/riddles-v1 --output data/moore-v2
#   fasospeech run recipes/moore-v2/combine.yaml --output data/moore-v2
# Configs: the trimmed TTS clips by category (contes, devinettes, proverbes; the Hub `default` config
# joins the three), asr (music bed kept), asr_negatives (music-only clips, empty text), asr_tagged
# (untrimmed, <MUSIC> on edges) and fra (French readings).
language: mos
steps: [speakers, export]
export:
  formats: [manifest, hf]
  configs:
    - {name: contes, view: tts, where: {category: conte}}
    - {name: devinettes, view: tts, where: {category: devinette}}
    - {name: proverbes, view: tts, where: {category: proverbe}}
    - asr
    - asr_negatives
    - asr_tagged
    - fra
  # repo_id: anyantudre/MooreSpeechCorporaV2
  private: true
  gated: manual
