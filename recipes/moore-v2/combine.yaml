# MooreSpeechCorporaV2: label speakers and export, after the six source recipes and
#   fasospeech combine data/proverbs-p data/proverbs-sissao data/tales-sibalo data/tales-v1 data/tales-vol5 data/riddles-v1 --output data/moore-v2
#   fasospeech run recipes/moore-v2/combine.yaml --output data/moore-v2
# One dataset, five configs: tts (trimmed clips), asr (music bed kept), asr_negatives
# (music-only clips, empty text), asr_tagged (untrimmed, <MUSIC> on edges) and fra (French readings).
language: mos
steps: [speakers, export]
export:
  formats: [manifest, hf]
  configs: [tts, asr, asr_negatives, asr_tagged, fra]
  # repo_id: anyantudre/MooreSpeechCorporaV2
  private: true
  gated: manual
