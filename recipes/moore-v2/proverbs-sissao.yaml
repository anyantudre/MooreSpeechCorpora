# MooreSpeechCorporaV2: Sissao proverb volumes prv-v09, prv-v10, prv-v11 (SIL ipsapps; one audio file
# per page, each page reading several proverbs with their French translations).
language: mos
source:
  type: ipsapps
  mode: chapters
  translation_language: fra
  start:
    - https://media.ipsapps.org/mos/ora/prv-v09/01-B001-001.html
    - https://media.ipsapps.org/mos/ora/prv-v10/01-B001-001.html
    - https://media.ipsapps.org/mos/ora/prv-v11/01-B001-001.html
steps: [fetch, prepare, align, trim, verify, filter]
trim:
  margin: 0.2
verify:
  models:
    - {model: facebook/mms-1b-all, target_lang: mos}
    - {model: anyantudre/moore-asr-eval-w2vbert}     # gated: request access, set HF_TOKEN
filter:
  languages: [mos]
  min_score: null            # music lowers alignment scores; CER is the quality gate instead
  max_cer: 0.25
  min_duration: 0.8
  min_chars_per_second: 5        # about 4 letters per second: drops clips with long pauses inside
  max_duration: 20
  max_music_under_voice_db: -30
  clean_text: true
  no_digits: true
