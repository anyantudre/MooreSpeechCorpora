# MooreSpeechCorporaV3: tales vol3 to vol5 from MooreSpeechCorpora (contes). Their original books are not
# known, so the published clips are re-processed (trimmed, cleaned, scored, filtered).
language: mos
metadata: {category: conte}
source:
  type: hf_dataset
  repo: anyantudre/MooreSpeechCorpora
  subset: contes             # the contes config (formerly moore-speech-contes)
  splits: [vol3, vol4]          # vol5 is re-aligned in tales-vol5.yaml
  text_column: transcription
  keep_columns: [chapter]
steps: [fetch, prepare, align, trim, verify, detect_cs, filter]
trim:
  margin: 0.2
verify:
  models:
    - {model: facebook/mms-1b-all, target_lang: mos}
    - {model: anyantudre/moore-asr-eval-w2vbert}     # gated: request access, set HF_TOKEN
    - {model: facebook/mms-1b-all, target_lang: fra, name: mms-1b-all-fra, languages: [fra], max_batch_seconds: 30}   # French lines only
detect_cs:
  embedded: [fra]
  lexicon_from:              # one Mooré lexicon for all sources (paths from where you run fasospeech)
    - data/proverbs-p/aligned.jsonl
    - data/proverbs-sissao/aligned.jsonl
    - data/tales-sibalo/aligned.jsonl
    - data/tales-v1/aligned.jsonl
    - data/tales-vol5/aligned.jsonl
    - data/riddles-v1/aligned.jsonl
  loans: null               # a versioned loan list, one word per line, to be built with native speakers
filter:
  languages: [mos]
  min_score: null            # music lowers alignment scores; CER is the quality gate instead
  max_cer: 0.25
  min_duration: 0.8
  min_chars_per_second: 5        # about 4 letters per second: drops clips with long pauses inside
  max_duration: 20
  max_music_under_voice_db: -30
  clean_text: true
  no_digits: true
  variants:
    asr: {max_music_under_voice_db: null, min_chars_per_second: 3}    # keep the music bed and slow speech
    fra: {languages: [fra]}                                           # the French readings, scored with mms-fra
  negatives: {of: asr, max_share: 0.1, min_len: 1.0}                  # music-only clips, empty text
  tagged: {of: asr, min_music: 0.5}                                   # untrimmed audio, <MUSIC> on music edges
